<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Projeto TFC - UniRV</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        #toast, .toast {
            position: fixed !important;
            bottom: 24px !important;
            right: 24px !important;
            z-index: 99999 !important;
            max-width: 420px !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card Principal de Login -->
    <div class="max-w-md w-full bg-slate-800/90 border border-slate-700/80 rounded-2xl shadow-2xl p-8 backdrop-blur-md">
        
        <!-- Header da Marca / Projeto -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600/20 border border-blue-500/30 text-blue-400 mb-4 shadow-inner">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight flex items-center justify-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                Projeto TFC
            </h1>
            <p class="text-xs text-slate-400 font-medium tracking-wide mt-1">UniRV • ESW424 - Prática de Engenharia de Software</p>
            <p class="text-xs text-blue-400 font-semibold mt-0.5">Sistema Administrativo-Financeiro (N2)</p>
        </div>

        {% if erro %}
        <div class="mb-5 p-3.5 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs font-semibold flex items-center gap-2">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        <!-- Formulário de Login -->
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Usuário</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <input type="text" id="username" name="username" required
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="Ex: admin ou cliente">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Senha</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-lg shadow-blue-600/30 transition flex items-center justify-center gap-2">
                <span>Acessar o Sistema</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
            </button>
        </form>

        <!-- Divisor com Acessos Rápidos -->
        <div class="mt-8 pt-6 border-t border-slate-700/80">
            <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 text-center mb-3">
                Acessos Rápidos para Avaliação
            </p>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <!-- Botão Rápido Admin -->
                <button type="button" onclick="loginRapido('admin', 'admin')"
                    class="p-3 rounded-xl bg-slate-900/70 border border-blue-500/30 hover:border-blue-500 hover:bg-blue-500/10 text-left transition group">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-bold text-white group-hover:text-blue-400">🛡️ Admin</span>
                        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300">Total</span>
                    </div>
                    <p class="text-[11px] text-slate-400">Pode inativar e reativar contas e cadastros.</p>
                </button>

                <!-- Botão Rápido Cliente -->
                <button type="button" onclick="loginRapido('cliente', 'cliente')"
                    class="p-3 rounded-xl bg-slate-900/70 border border-amber-500/30 hover:border-amber-500 hover:bg-amber-500/10 text-left transition group">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-xs font-bold text-white group-hover:text-amber-400">👤 Cliente</span>
                        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300">Restrito</span>
                    </div>
                    <p class="text-[11px] text-slate-400">Sem permissão para inativar contas.</p>
                </button>
            </div>
        </div>

        <!-- Rodapé do Card -->
        <div class="mt-6 text-center text-xs text-slate-500">
            <span>Credenciais: <strong>admin / admin</strong> ou <strong>cliente / cliente</strong></span>
        </div>

    </div>

    <script>
        function loginRapido(usuario, senha) {
            document.getElementById('username').value = usuario;
            document.getElementById('password').value = senha;
            document.querySelector('form').submit();
        }
    </script>
</body>
</html>
